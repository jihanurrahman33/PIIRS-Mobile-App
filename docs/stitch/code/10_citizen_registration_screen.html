b2e", "on-secondary-fixed": "#001e2f", "on-secondary": "#ffffff", "surface-dim": "#d2d9f4", "status-rejected": "#EF4444", "surface-container-low": "#f2f3ff", "surface-container": "#eaedff", "status-boosted": "#8B5CF6", "on-background": "#131b2e", "surface-container-high": "#e2e7ff", "inverse-primary": "#c0c1ff", "surface-variant": "#dae2fd", "outline": "#767586", "background": "#faf8ff", "error-container": "#ffdad6", "text-muted": "#94A3B8", "surface-dark": "#1E293B", "status-resolved": "#10B981", "primary": "#4648d4", "on-primary-fixed-variant": "#2f2ebe", "tertiary-fixed-dim": "#ffb783", "inverse-on-surface": "#eef0ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-md": "0.75rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter": "1rem" }, fontFamily: { "label": ["Inter"], "body": ["Inter"], "display": ["Inter"], "body-lg": ["Inter"], "headline": ["Inter"], "title": ["Inter"], "caption": ["Inter"] }, fontSize: { "label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.2px", "fontWeight": "500" }], "body": ["14px", { "lineHeight": "21px", "fontWeight": "400" }], "display": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.5px", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.3px", "fontWeight": "600" }], "title": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "caption": ["11px", { "lineHeight": "14px", "fontWeight": "400" }] } } } }</script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-surface font-body text-body text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Navigate back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><span class="font-title text-title text-on-surface truncate">Register Account</span></div><div class="flex items-center gap-space-sm"></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-gutter pb-space-xl">
<!-- Warm Human Civic Illustration & Impact Badge -->

<!-- Registration Form Container -->
<form class="flex flex-col gap-space-md" id="signupForm" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label text-label text-on-surface font-medium flex items-center justify-between" for="fullName">
<span class="">Full Name</span>

</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(15,23,42,0.04)] focus-within:bg-surface-container-lowest focus-within:shadow-[0_4px_16px_rgba(70,72,212,0.14)] transition-all duration-200">
<div class="w-12 h-12 flex items-center justify-center text-text-muted pl-1">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input autocomplete="name" class="w-full h-12 bg-transparent pr-4 font-body text-body text-on-surface placeholder:text-text-muted focus:outline-none" id="fullName" placeholder="e.g. Alex Morgan" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label text-label text-on-surface font-medium flex items-center justify-between" for="email">
<span class="">Email Address</span>

</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(15,23,42,0.04)] focus-within:shadow-[0_4px_16px_rgba(70,72,212,0.14)] transition-all duration-200">
<div class="w-12 h-12 flex items-center justify-center text-text-muted pl-1">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-12 bg-transparent pr-4 font-body text-body text-on-surface placeholder:text-text-muted focus:outline-none" id="email" placeholder="alex@example.com" required="" type="email">
</div>
</div>
<!-- Phone Number Field with Country Picker -->
<div class="flex flex-col gap-space-xs">
<label class="font-label text-label text-on-surface font-medium flex items-center justify-between" for="phoneNumber">
<span class="">Phone Number</span>

</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(15,23,42,0.04)] focus-within:shadow-[0_4px_16px_rgba(70,72,212,0.14)] transition-all duration-200">
<div class="flex items-center pl-3 pr-2 gap-1.5 cursor-pointer select-none">
<span class="text-[17px] leading-none select-none">🇺🇸</span>
<span class="font-label text-label font-semibold text-on-surface">+1</span>
<span class="material-symbols-outlined text-[16px] text-text-muted">keyboard_arrow_down</span>
</div>
<div class="h-6 w-[1.5px] bg-surface-container-highest my-auto"></div>
<input autocomplete="tel" class="w-full h-12 bg-transparent px-3 font-body text-body text-on-surface placeholder:text-text-muted focus:outline-none" id="phoneNumber" placeholder="(555) 019-2834" type="tel">
<div class="pr-3 text-text-muted">
<span class="material-symbols-outlined text-[18px]">call</span>
</div>
</div>
</div>
<!-- Password Field with Interactive Strength Meter -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label text-label text-on-surface font-medium" for="password">Create Password</label>
<span class="font-label text-label text-priority-low font-semibold transition-all" id="strengthText">Strong</span>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(15,23,42,0.04)] focus-within:shadow-[0_4px_16px_rgba(70,72,212,0.14)] transition-all duration-200">
<div class="w-12 h-12 flex items-center justify-center text-text-muted pl-1">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="new-password" class="w-full h-12 bg-transparent pr-11 font-body text-body text-on-surface placeholder:text-text-muted focus:outline-none" id="password" placeholder="At least 8 characters" required="" type="password" value="NeighborhoodHero2024!">
<button aria-label="Toggle password visibility" class="absolute right-1 w-10 h-10 flex items-center justify-center text-text-muted hover:text-on-surface focus:outline-none" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
</button>
</div>
<!-- 4-bar Password Strength Indicator -->
<div class="pt-1.5 pb-0.5 flex flex-col gap-1.5">
<div class="grid grid-cols-4 gap-1.5 w-full h-1.5" id="meterBars">
<div class="h-full rounded-full bg-priority-low transition-all duration-300"></div>
<div class="h-full rounded-full bg-priority-low transition-all duration-300"></div>
<div class="h-full rounded-full bg-priority-low transition-all duration-300"></div>
<div class="h-full rounded-full bg-priority-low transition-all duration-300"></div>
</div>
<div class="flex items-center gap-1.5 text-text-muted text-caption font-caption">
<span class="material-symbols-outlined text-[14px] text-priority-low">check_circle</span>
<span class="">Includes symbols, capital letters, and numbers</span>
</div>
</div>
</div>
<!-- Community Role Preview Card -->

<!-- Interactive Terms Checkbox -->
<div class="flex items-start gap-3 pt-1 cursor-pointer select-none" id="checkboxWrapper">


</div>
<!-- Large CTA Button -->
<button class="w-full h-[52px] rounded-xl bg-primary text-on-primary font-title text-title font-semibold shadow-[0_6px_20px_rgba(70,72,212,0.32)] active:scale-[0.98] hover:bg-primary-container transition-all flex items-center justify-center gap-2 mt-1" id="submitBtn" type="submit">
<span class="">Create Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Login Link Footnote -->
<div class="flex items-center justify-center gap-1.5 mt-space-lg text-center">
<span class="font-body text-body text-text-secondary">Already registered?</span>
<a class="font-body text-body text-primary font-semibold hover:underline flex items-center gap-0.5" href="#">
      Log In
      <span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</div>
<!-- Neighborhood Trust Indicator -->

</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    const strengthText = document.getElementById('strengthText');
    const meterBars = document.getElementById('meterBars');
    const checkboxWrapper = document.getElementById('checkboxWrapper');
    const termsCheckbox = document.getElementById('termsCheckbox');

    // Toggle Password Visibility
    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Dynamic Password Strength Evaluation
    function evaluateStrength(val) {
      let score = 0;
      if (!val) return 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      return score;
    }

    function updateMeter(score) {
      if (!meterBars || !strengthText) return;
      const bars = meterBars.children;
      
      const configs = [
        { label: 'Too Weak', colorClass: 'bg-priority-urgent', textColor: 'text-priority-urgent', count: 1 },
        { label: 'Fair', colorClass: 'bg-priority-high', textColor: 'text-priority-high', count: 2 },
        { label: 'Good', colorClass: 'bg-secondary-container', textColor: 'text-secondary', count: 3 },
        { label: 'Strong', colorClass: 'bg-priority-low', textColor: 'text-priority-low', count: 4 }
      ];

      const current = configs[Math.max(0, Math.min(score - 1, 3))] || {
        label: 'Enter password',
        colorClass: 'bg-surface-container-highest',
        textColor: 'text-text-muted',
        count: 0
      };

      strengthText.textContent = current.label;
      strengthText.className = 'font-label text-label font-semibold transition-all ' + current.textColor;

      for (let i = 0; i < bars.length; i++) {
        bars[i].className = 'h-full rounded-full transition-all duration-300 ' + 
          (i < current.count ? current.colorClass : 'bg-surface-container-highest');
      }
    }

    if (passwordInput) {
      passwordInput.addEventListener('input', (e) => {
        const score = evaluateStrength(e.target.value);
        updateMeter(score);
      });
    }

    // Keyboard support for terms checkbox container
    if (checkboxWrapper && termsCheckbox) {
      checkboxWrapper.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          termsCheckbox.checked = !termsCheckbox.checked;
        }
      });
    }
  })();
</script></main>

</body></html>
