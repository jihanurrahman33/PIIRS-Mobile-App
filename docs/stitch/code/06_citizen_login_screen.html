<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    if (!pwdInput || !toggleIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      toggleIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      toggleIcon.textContent = 'visibility';
    }
  }

  function handleEmailInput(val) {
    const status = document.getElementById('emailStatus');
    if (!status) return;
    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    if (isValid) {
      status.classList.remove('opacity-0');
      status.classList.add('opacity-100');
    } else {
      status.classList.remove('opacity-100');
      status.classList.add('opacity-0');
    }
  }

  function triggerSocialFeedback(provider) {
    const btn = event.currentTarget;
    if (!btn) return;
    btn.classList.add('ring-2', 'ring-primary/40');
    setTimeout(() => {
      btn.classList.remove('ring-2', 'ring-primary/40');
    }, 400);
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('signInSubmitBtn');
    const text = document.getElementById('btnText');
    const icon = document.getElementById('btnIcon');
    if (!btn || !text || !icon) return;

    btn.disabled = true;
    text.textContent = 'Verifying...';
    icon.textContent = 'sync';
    icon.classList.add('animate-spin');

    setTimeout(() => {
      text.textContent = 'Welcome in!';
      icon.classList.remove('animate-spin');
      icon.textContent = 'check';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-priority-low');
    }, 1000);
  }
</script></main>
