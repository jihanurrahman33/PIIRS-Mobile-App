<script>
  (function() {
    const desc = document.getElementById('issue-description');
    const counter = document.getElementById('char-counter');
    if (desc && counter) {
      desc.addEventListener('input', function() {
        counter.textContent = this.value.length + '/500';
      });
    }

    const toggle = document.getElementById('anon-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        const isChecked = this.getAttribute('aria-checked') === 'true';
        this.setAttribute('aria-checked', (!isChecked).toString());
        const knob = this.querySelector('span');
        if (!isChecked) {
          this.classList.remove('bg-outline-variant');
          this.classList.add('bg-primary');
          knob.classList.remove('translate-x-1');
          knob.classList.add('translate-x-6');
        } else {
          this.classList.remove('bg-primary');
          this.classList.add('bg-outline-variant');
          knob.classList.remove('translate-x-6');
          knob.classList.add('translate-x-1');
        }
      });
    }

    const priorityBtns = document.querySelectorAll('.priority-btn');
    const priorityHint = document.getElementById('priority-hint');
    const hints = {
      low: { text: 'Low impact cosmetic issue', color: 'text-priority-low', bg: 'bg-priority-low' },
      normal: { text: 'Standard queue review', color: 'text-priority-normal', bg: 'bg-priority-normal' },
      high: { text: 'Attention needed promptly', color: 'text-priority-high', bg: 'bg-priority-high' },
      urgent: { text: 'Critical safety hazard', color: 'text-priority-urgent', bg: 'bg-priority-urgent' }
    };

    priorityBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        priorityBtns.forEach(b => {
          b.className = 'priority-btn py-2 text-center rounded-lg font-label text-label text-text-secondary transition-all';
        });
        const type = this.getAttribute('data-priority');
        const config = hints[type];
        this.className = 'priority-btn py-2 text-center rounded-lg font-label text-label font-semibold ' + config.bg + ' text-on-primary shadow-sm transition-all';
        if (priorityHint) {
          priorityHint.textContent = config.text;
          priorityHint.className = 'font-caption text-caption ' + config.color + ' font-medium';
        }
      });
    });

    const submitBtn = document.getElementById('submit-report');
    if (submitBtn) {
      submitBtn.addEventListener('click', function() {
        const originalContent = this.innerHTML;
        this.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Dispatching...</span>';
        this.classList.add('opacity-90', 'pointer-events-none');
        setTimeout(() => {
          this.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Report Dispatched!</span>';
          this.classList.remove('bg-primary', 'hover:bg-primary-container');
          this.classList.add('bg-status-resolved');
        }, 1200);
      });
    }
  })();
</script></main>
